name: ${COMPOSE_PROJECT_NAME:-maci-boilerplate}

services:
  database:
    image: postgres:16.10-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-18701}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [maci]

  directus:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${DIRECTUS_PORT:-18707}:8055"
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
      CORS_METHODS: GET,POST,PATCH,DELETE
      TELEMETRY: "false"
      EXTENSIONS_AUTO_RELOAD: "true"
    volumes:
      - ./uploads:/directus/uploads
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8055/server/health').then(r=>{if(!r.ok)throw new Error(r.status)})",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
    networks: [maci]

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports:
      - "${QDRANT_TCP_PORT:-18703}:6333"
      - "${QDRANT_GRPC_PORT:-18704}:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [maci]

  next-app:
    build:
      context: ../app
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "${NEXT_PORT:-18708}:3000"
    environment:
      NODE_ENV: development
      DIRECTUS_INTERNAL_URL: http://directus:8055
      NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      QDRANT_URL: http://qdrant:6333
      DIRECTUS_SERVICE_TOKEN: ${DIRECTUS_SERVICE_TOKEN:-}
DIRECTUS_CONFIGURATOR_TOKEN: ${DIRECTUS_CONFIGURATOR_TOKEN:-}
      CESIUM_ION_TOKEN: ${CESIUM_ION_TOKEN:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
    volumes:
      - ../app:/app
      - next_node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      directus:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)throw new Error(r.status)})",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
    networks: [maci]

volumes:
  next_node_modules:
  next_cache:

networks:
  maci:

